name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      run_snowflake_live_tests:
        description: 'Run Snowflake live tests (real network)'
        required: false
        default: 'false'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Node TS import check
        run: yarn import:check

      - name: Format check
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

  chutney:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Install Tor + Python tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y tor tor-geoipdb python3 python3-pip git

      - name: Run Chutney integration test
        run: bash packages/tor/scripts/ci-chutney.sh

  chutney_snowflake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Install Tor + Python tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y tor tor-geoipdb python3 python3-pip git

      - name: Run Chutney+Snowflake integration test
        run: bash packages/snowflake/scripts/ci-chutney-snowflake.sh

  snowflake_live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'workflow_dispatch' && inputs.run_snowflake_live_tests == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Run Snowflake live tests
        env:
          SNOWFLAKE_LIVE: '1'
        run: yarn workspace snowflake test:live
