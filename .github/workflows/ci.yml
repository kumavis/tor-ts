name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Typecheck
        run: yarn typecheck

      - name: Format check
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

  verify_core:
    name: Verify tor-core (Thales + Lean)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show Lean version
        run: |
          cd packages/core
          lake --version
          lean --version

      - name: Cache Thales build
        uses: actions/cache@v4
        with:
          path: packages/core/.thales
          # Cache key reads the SHA out of verify.sh so it stays in sync
          # whenever the pin is bumped.
          key: thales-${{ runner.os }}-${{ hashFiles('packages/core/scripts/verify.sh') }}

      - name: Verify
        run: bash packages/core/scripts/verify.sh

  chutney:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Install Tor + Python tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y tor tor-geoipdb python3 python3-pip git

      - name: Install Chutney (clone + pip deps)
        run: bash packages/tor/scripts/ci-chutney-install.sh

      - name: Run Chutney integration test
        env:
          CHUTNEY_SKIP_INSTALL: '1'
        run: bash packages/tor/scripts/ci-chutney.sh

  chutney_snowflake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Install Tor + Python tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y tor tor-geoipdb python3 python3-pip git

      - name: Run Chutney+Snowflake integration test
        run: bash packages/snowflake/scripts/ci-chutney-snowflake.sh

  snowflake_live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Run Snowflake live tests
        env:
          SNOWFLAKE_LIVE: '1'
        run: yarn workspace snowflake test:live

  examples_live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Run node-fetch example live tests
        run: yarn workspace tor-example-node-fetch test:live

      - name: Run http-proxy example live tests
        run: yarn workspace tor-example-http-proxy test:live
