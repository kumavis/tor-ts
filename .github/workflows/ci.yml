name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Node TS import check
        run: yarn import:check

      - name: Format check
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

  chutney:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Install Tor + Python tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y tor tor-geoipdb python3 python3-pip git

      - name: Run Chutney integration test (optional on PRs)
        env:
          TOR_TS_CHUTNEY_OPTIONAL: ${{ github.event_name == 'pull_request' }}
        run: |
          set +e
          bash packages/tor/scripts/ci-chutney.sh
          status=$?

          if [ "$TOR_TS_CHUTNEY_OPTIONAL" = "true" ] && [ $status -ne 0 ]; then
            echo "::warning::Chutney integration test failed (exit code $status). This is non-blocking on pull requests."
            exit 0
          fi

          exit $status
