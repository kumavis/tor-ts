name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Typecheck
        run: yarn typecheck

      - name: Format check
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

  build_tor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tor build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential libevent-dev libssl-dev zlib1g-dev liblzma-dev libzstd-dev

      - name: Cache pinned Tor binaries
        uses: actions/cache@v4
        with:
          path: .ci-tor/install
          key: tor-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('packages/tor/scripts/ci-build-tor.sh') }}

      - name: Build pinned C Tor
        run: bash packages/tor/scripts/ci-build-tor.sh

      - name: Share Tor binaries
        uses: actions/upload-artifact@v4
        with:
          name: chutney-tor
          path: .ci-tor/tor-bin.tar.gz
          retention-days: 7

  chutney:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [test, build_tor]

    env:
      CHUTNEY_DATA_DIR: /tmp/tor-ts-chutney-data

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Install Tor runtime and Python tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-2.1-7t64 libssl3t64 zlib1g liblzma5 libzstd1 python3 python3-venv git

      - name: Download pinned Tor binaries
        uses: actions/download-artifact@v4
        with:
          name: chutney-tor
          path: .ci-tor

      - name: Select pinned Tor for Chutney
        run: |
          tar -xzf .ci-tor/tor-bin.tar.gz -C .ci-tor
          echo "$GITHUB_WORKSPACE/.ci-tor/bin" >> "$GITHUB_PATH"
          echo "CHUTNEY_TOR=$GITHUB_WORKSPACE/.ci-tor/bin/tor" >> "$GITHUB_ENV"
          echo "CHUTNEY_TOR_GENCERT=$GITHUB_WORKSPACE/.ci-tor/bin/tor-gencert" >> "$GITHUB_ENV"
          .ci-tor/bin/tor --version

      - name: Install Chutney (clone + pip deps)
        run: bash packages/tor/scripts/ci-chutney-install.sh

      - name: Run Chutney integration test
        env:
          CHUTNEY_SKIP_INSTALL: '1'
        run: bash packages/tor/scripts/ci-chutney.sh

      - name: Upload Chutney diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chutney-logs
          path: |
            /tmp/tor-ts-chutney-data/nodes*/**/*.log
            /tmp/tor-ts-chutney-data/nodes*/**/tor.stdout
            /tmp/tor-ts-chutney-data/nodes*/**/tor.stderr
            /tmp/tor-ts-chutney-data/nodes*/**/torrc
            /tmp/tor-ts-chutney-data/nodes*/**/cached-microdesc-consensus
          if-no-files-found: ignore
          retention-days: 7

  chutney_snowflake:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [test, build_tor]

    env:
      CHUTNEY_DATA_DIR: /tmp/tor-ts-chutney-data

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Install Tor runtime and Python tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-2.1-7t64 libssl3t64 zlib1g liblzma5 libzstd1 python3 python3-venv git

      - name: Download pinned Tor binaries
        uses: actions/download-artifact@v4
        with:
          name: chutney-tor
          path: .ci-tor

      - name: Select pinned Tor for Chutney
        run: |
          tar -xzf .ci-tor/tor-bin.tar.gz -C .ci-tor
          echo "$GITHUB_WORKSPACE/.ci-tor/bin" >> "$GITHUB_PATH"
          echo "CHUTNEY_TOR=$GITHUB_WORKSPACE/.ci-tor/bin/tor" >> "$GITHUB_ENV"
          echo "CHUTNEY_TOR_GENCERT=$GITHUB_WORKSPACE/.ci-tor/bin/tor-gencert" >> "$GITHUB_ENV"
          .ci-tor/bin/tor --version

      - name: Install Chromium for browser onion test
        run: npx playwright install --with-deps chromium

      - name: Run Chutney+Snowflake integration test
        run: bash packages/snowflake/scripts/ci-chutney-snowflake.sh

      - name: Upload Chutney diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chutney_snowflake-logs
          path: |
            /tmp/tor-ts-chutney-data/nodes*/**/*.log
            /tmp/tor-ts-chutney-data/nodes*/**/tor.stdout
            /tmp/tor-ts-chutney-data/nodes*/**/tor.stderr
            /tmp/tor-ts-chutney-data/nodes*/**/torrc
            /tmp/tor-ts-chutney-data/nodes*/**/cached-microdesc-consensus
          if-no-files-found: ignore
          retention-days: 7

  snowflake_live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Run Snowflake live tests
        env:
          SNOWFLAKE_LIVE: '1'
        run: yarn workspace snowflake test:live

  examples_live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Run node-fetch example live tests
        run: yarn workspace tor-example-node-fetch test:live

      - name: Run http-proxy example live tests
        run: yarn workspace tor-example-http-proxy test:live
